name: CONPLANOS GNSS checks
on:
  pull_request:
    paths:
      - 'app.py'
      - 'core.py'
      - 'verify_local.py'
      - '.github/workflows/gnss-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile modules
        run: python -m compileall -q app.py core.py verify_local.py certificate.py ephemeris.py history.py drive.py
      - name: Run GNSS regression suite
        run: python verify_local.py
