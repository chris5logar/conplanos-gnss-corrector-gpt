# ============================================================
# VALORES RAÍZ
# ============================================================
GOOGLE_SHEET_ID = "ID_DE_TU_HOJA_DE_GOOGLE"
# Opcional: permite incrustar un visor Google Maps dentro de la app. Requiere una API key de Maps Embed.
# GOOGLE_MAPS_EMBED_API_KEY = "TU_API_KEY_DE_GOOGLE_MAPS"
# Opcional: restringe el acceso por correo de Google.
# AUTHORIZED_GOOGLE_EMAILS = "correo1@gmail.com,correo2@gmail.com"

# ============================================================
# 1) LOGIN CON GOOGLE (opcional pero recomendado)
# ============================================================
[auth]
redirect_uri = "https://procesaconplanos.streamlit.app/oauth2callback"
cookie_secret = "GENERA_UN_SECRETO_LARGO_Y_ALEATORIO"
client_id = "TU_CLIENT_ID_DE_GOOGLE"
client_secret = "TU_CLIENT_SECRET_DE_GOOGLE"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# ============================================================
# 2) CUENTA DE SERVICIO PARA GOOGLE SHEETS
# ============================================================
[gcp_service_account]
type = "service_account"
project_id = "TU_PROJECT_ID"
private_key_id = "TU_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nTU_CLAVE\n-----END PRIVATE KEY-----\n"
client_email = "tu-cuenta-de-servicio@tu-proyecto.iam.gserviceaccount.com"
client_id = "TU_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "URL_DEL_CERTIFICADO"

# NO pongas este archivo con credenciales reales en GitHub.
