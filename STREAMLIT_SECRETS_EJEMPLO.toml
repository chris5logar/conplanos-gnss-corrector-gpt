# ============================================================
# CONPLANOS GNSS 10.3 · EJEMPLO DE SECRETS
# ============================================================
# Este archivo es SOLO una plantilla. NO pongas credenciales reales aquí
# y NO subas un secrets.toml real a GitHub.

# ---------------- GOOGLE SHEETS ----------------
GOOGLE_SHEET_ID = "ID_REAL_DE_TU_HOJA"

# ---------------- GOOGLE DRIVE ----------------
# OPCIONAL. Si lo dejas vacío/ausente, CONPLANOS creará o reutilizará
# una carpeta llamada "CONPLANOS GNSS - CERTIFICADOS" en el Drive de la cuenta de servicio.
# Si prefieres una carpeta específica, pega aquí su ID.
# GOOGLE_DRIVE_FOLDER_ID = "ID_DE_CARPETA_DE_DRIVE"

# ---------------- GOOGLE MAPS EMBED ----------------
# OPCIONAL. Solo si quieres incrustar Google Maps dentro de la app.
# GOOGLE_MAPS_EMBED_API_KEY = "AIza..."

# ---------------- CONTROL DE ACCESO ----------------
# OPCIONAL. Lista separada por comas.
# AUTHORIZED_GOOGLE_EMAILS = "tu-correo@gmail.com,otro-correo@gmail.com"

# ---------------- LOGIN GOOGLE (OIDC) ----------------
[auth]
redirect_uri = "https://procesaconplanos.streamlit.app/oauth2callback"
cookie_secret = "GENERA_UN_SECRETO_LARGO_Y_ALEATORIO"
client_id = "TU_CLIENT_ID_DE_GOOGLE"
client_secret = "TU_CLIENT_SECRET_DE_GOOGLE"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# ---------------- CUENTA DE SERVICIO ----------------
[gcp_service_account]
type = "service_account"
project_id = "TU_PROJECT_ID"
private_key_id = "TU_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nTU_CLAVE_PRIVADA\n-----END PRIVATE KEY-----\n"
client_email = "conplanos-gnss@TU-PROYECTO.iam.gserviceaccount.com"
client_id = "TU_CLIENT_ID_DE_SERVICE_ACCOUNT"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "URL_DEL_CERTIFICADO"
