# NO pongas este archivo con credenciales reales en GitHub.
# En Streamlit Cloud: Manage app -> Settings -> Secrets

GOOGLE_SHEET_ID = "ID_DE_TU_GOOGLE_SHEET"

[gcp_service_account]
type = "service_account"
project_id = "TU_PROJECT_ID"
private_key_id = "TU_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nPEGA_AQUI_LA_CLAVE\n-----END PRIVATE KEY-----\n"
client_email = "TU_SERVICE_ACCOUNT@TU_PROJECT_ID.iam.gserviceaccount.com"
client_id = "TU_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "URL_DEL_CERTIFICADO_DEL_SERVICE_ACCOUNT"
